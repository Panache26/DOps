version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_secret
      POSTGRES_DB: finance_db
    volumes:
      - finance_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_secret
      POSTGRES_DB: finance_db
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  finance_pg_data: